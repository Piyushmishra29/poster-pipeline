<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sticker — Citation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,75..150,400..900;1,75..150,400..900&family=Inter+Tight:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* sticker 70 x 110 mm + 3mm bleed = 76 x 116 mm */
  @page { size: 76mm 116mm; margin: 0; bleed: 3mm; marks: crop cross; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 76mm; height: 116mm; }
  .stage { position: relative; width: 76mm; height: 116mm; }

  .diecut { position: absolute; top: 2mm; left: 2mm; width: 72mm; height: 112mm; background: #F4EFDA; /* manila yellow */ }
  .cutline {
    position: absolute; top: 4mm; left: 4mm;
    width: 68mm; height: 108mm;
    background: transparent; border: 0.5mm dashed #FF00FF;
    z-index: 9;
  }

  .form {
    position: absolute; top: 7mm; left: 7mm; right: 7mm; bottom: 7mm;
    color: #171921; font-family: 'JetBrains Mono', monospace;
    border: 0.5mm solid #171921;
  }
  /* dept seal strip */
  .seal {
    background: #171921; color: #D1DD27;
    text-align: center; padding: 2.4mm 0;
    font-family: 'Anybody', sans-serif; font-weight: 900; font-variation-settings: "wdth" 150;
    font-size: 9pt; letter-spacing: 0.18em; line-height: 0.9;
    text-transform: uppercase;
  }
  .seal small {
    display: block; font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 4.6pt; letter-spacing: 0.36em; margin-top: 0.8mm; color: #FFFFFF;
  }
  .head {
    background: #D1DD27; color: #171921;
    text-align: center; padding: 2mm 0;
    font-family: 'Anybody', sans-serif; font-weight: 900; font-variation-settings: "wdth" 150;
    font-size: 18pt; line-height: 0.86; letter-spacing: -0.02em;
    text-transform: uppercase;
    border-top: 0.5mm solid #171921; border-bottom: 0.5mm solid #171921;
  }
  .body { padding: 3mm 4mm; }
  .row {
    display: flex; align-items: baseline; gap: 2.2mm;
    font-size: 6.4pt; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    border-bottom: 0.3mm dashed rgba(23,25,33,0.55); padding: 1.2mm 0;
  }
  .row .l { flex: 0 0 22mm; opacity: 0.85; }
  .row .v {
    flex: 1;
    font-family: 'Anybody', sans-serif; font-weight: 900; font-variation-settings: "wdth" 110;
    font-size: 8pt; letter-spacing: 0.02em;
  }
  .violation {
    background: #171921; color: #D1DD27;
    text-align: center; padding: 3mm 2mm;
    margin: 2.4mm 0;
    font-family: 'Anybody', sans-serif; font-weight: 900; font-variation-settings: "wdth" 150;
    line-height: 0.84; letter-spacing: -0.02em; text-transform: uppercase;
  }
  .violation .l {
    font-family: 'JetBrains Mono', monospace; font-weight: 800;
    font-size: 5.4pt; letter-spacing: 0.32em; color: #FFFFFF; display: block; margin-bottom: 1.4mm;
  }
  .violation .v { font-size: 17pt; }
  .penalty {
    border: 0.4mm dashed #171921;
    padding: 1.8mm 2.4mm; margin-bottom: 2.5mm;
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'Anybody', sans-serif; font-weight: 900; font-variation-settings: "wdth" 110;
    font-size: 11pt; letter-spacing: -0.01em; text-transform: uppercase;
  }
  .penalty .l { font-family: 'JetBrains Mono', monospace; font-size: 5.6pt; letter-spacing: 0.32em; font-weight: 800; }
  .stamp {
    position: absolute; bottom: 13mm; right: 4mm;
    border: 0.6mm solid #171921; color: #171921;
    padding: 1.6mm 2.6mm; transform: rotate(-9deg);
    font-family: 'Anybody', sans-serif; font-weight: 900; font-variation-settings: "wdth" 110;
    font-size: 9pt; line-height: 0.95; letter-spacing: 0.02em; text-transform: uppercase;
    background: rgba(244,239,218,0.4);
  }
  .stamp small {
    display: block; font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 4.4pt; letter-spacing: 0.22em; margin-top: 0.4mm;
  }
  .foot {
    position: absolute; bottom: 4mm; left: 4mm; right: 4mm;
    text-align: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 5.2pt; letter-spacing: 0.22em; text-transform: uppercase;
    line-height: 1.7;
    border-top: 0.3mm solid #171921; padding-top: 1.6mm;
  }
  .foot b { color: #171921; background: #D1DD27; padding: 0 0.8mm; font-weight: 800; }
</style>
</head>
<body>
  <div class="stage">
    <div class="diecut"></div>
    <div class="form">
      <div class="seal">ROCKWALL FITNESS · PD<small>BANGALORE · FY26</small></div>
      <div class="head">VIOLATION<br>NOTICE.</div>
      <div class="body">
        <div class="row"><span class="l">TICKET №</span><span class="v">0047</span></div>
        <div class="row"><span class="l">DATE</span><span class="v">06:00 / TODAY</span></div>
        <div class="row"><span class="l">OFFENDER</span><span class="v">YOU / SELF</span></div>
        <div class="row"><span class="l">LOCATION</span><span class="v">YOUR COUCH</span></div>

        <div class="violation"><span class="l">VIOLATION</span><span class="v">SKIPPING<br>LEG DAY.</span></div>

        <div class="penalty"><span class="l">PENALTY</span><span>ALL OF YOU</span></div>
      </div>
      <div class="stamp">PAY OR APPEAR<small>NO. 0047 · BLR</small></div>
      <div class="foot">
        DEPT OF <b>GAINS</b> · ROCKWALL FITNESS PD<br>
        REPORT IN @ 06:00 · NO EXCUSES
      </div>
    </div>
    <div class="cutline"></div>
  </div>
</body>
</html>
