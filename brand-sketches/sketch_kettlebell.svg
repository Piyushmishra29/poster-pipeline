<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FFFFFF"/>
  <g fill="#FFFFFF" stroke="#000000" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- Handle: upside-down U loop on top -->
    <path d="M150 118
             C 150 66 250 66 250 118" fill="none"/>
    <!-- Bell body: fat rounded blob with flat sitting bottom -->
    <path d="M200 116
             C 116 116 80 192 92 262
             C 96 292 104 320 130 330
             C 122 338 130 348 145 348
             L 255 348
             C 270 348 278 338 270 330
             C 296 320 304 292 308 262
             C 320 192 284 116 200 116 Z"/>
    <!-- Lime horizontal band across lower bell body (single accent) -->
    <path d="M95 282
             C 99 304 106 322 130 330
             C 122 338 130 348 145 348
             L 255 348
             C 270 348 278 338 270 330
             C 294 322 301 304 305 282
             C 240 296 160 296 95 282 Z"
          fill="#CFFF3C"/>
    <!-- Tiny U-arms -->
    <path d="M92 232 C 64 236 60 266 80 274" fill="none" stroke-width="11"/>
    <path d="M308 232 C 336 236 340 266 320 274" fill="none" stroke-width="11"/>
    <!-- Face: eyes -->
    <circle cx="170" cy="208" r="9" fill="#000000" stroke="none"/>
    <circle cx="230" cy="208" r="9" fill="#000000" stroke="none"/>
    <!-- Smile: U-curve -->
    <path d="M176 236 C 190 254 210 254 224 236" fill="none" stroke-width="8"/>
  </g>
</svg>
