<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sticker — Handle With Care Stencil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,75..150,400..900;1,75..150,400..900&family=Inter+Tight:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* sticker 110 x 46 mm + 3mm bleed = 116 x 52 mm */
  @page { size: 116mm 52mm; margin: 0; bleed: 3mm; marks: crop cross; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 116mm; height: 52mm; }
  .stage { position: relative; width: 116mm; height: 52mm; }

  /* white die-cut base, the "crate" */
  .diecut { position: absolute; top: 2mm; left: 2mm; width: 112mm; height: 48mm; background: #E6E0CF; /* kraft */ }
  /* magenta cut line */
  .cutline {
    position: absolute; top: 4mm; left: 4mm;
    width: 108mm; height: 44mm;
    background: transparent; border: 0.5mm dashed #FF00FF;
    z-index: 9;
  }

  /* navy stencil panel — like the spray-stencil ink on crate */
  .panel {
    position: absolute; top: 7mm; left: 7mm; right: 7mm; bottom: 7mm;
    color: #171921;
    font-family: 'Anybody', sans-serif; font-weight: 900;
    font-variation-settings: "wdth" 150;
    padding: 3mm 5mm;
    border: 0.6mm dashed #171921;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; column-gap: 6mm;
  }
  /* big center text */
  .main {
    text-align: center; line-height: 0.86; letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .main .lg { font-size: 20pt; }
  .main .xl { font-size: 30pt; }
  .main .lime {
    background: #D1DD27; padding: 0 1.6mm;
  }
  /* side stamps */
  .side {
    font-family: 'JetBrains Mono', monospace; font-weight: 800;
    font-size: 6.4pt; letter-spacing: 0.25em; line-height: 1.8;
    text-transform: uppercase;
  }
  .side div { display: flex; align-items: center; gap: 1.6mm; }
  .side .star { color: #D1DD27; font-size: 8pt; }
  .side.right { text-align: right; justify-content: flex-end; }
  .side.right div { justify-content: flex-end; }
  /* small footer slug stamp top-left and bottom-right */
  .corner-tl {
    position: absolute; top: 9.5mm; left: 9.5mm;
    font-family: 'JetBrains Mono', monospace; font-weight: 800;
    font-size: 5pt; letter-spacing: 0.3em; color: #171921;
    text-transform: uppercase;
    border: 0.4mm solid #171921; padding: 0.6mm 1.4mm;
  }
  .corner-br {
    position: absolute; bottom: 9.5mm; right: 9.5mm;
    font-family: 'JetBrains Mono', monospace; font-weight: 800;
    font-size: 5pt; letter-spacing: 0.3em; color: #171921;
    text-transform: uppercase;
    border: 0.4mm solid #171921; padding: 0.6mm 1.4mm;
    transform: rotate(-6deg);
  }
  /* arrows up */
  .arrows {
    position: absolute; left: 0; right: 0; top: 21mm;
    text-align: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 800;
    font-size: 7pt; letter-spacing: 0.32em; color: #171921;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="diecut"></div>
    <div class="panel">
      <div class="side">
        <div><span class="star">★</span>FRAGILE</div>
        <div><span class="star">★</span>DO NOT BEND</div>
        <div><span class="star">★</span>KEEP DRY</div>
      </div>
      <div class="main">
        <div class="lg">HANDLE WITH</div>
        <div class="xl"><span class="lime">CARE.</span></div>
        <div class="lg">LIFT <span style="color:#D1DD27">HEAVY.</span></div>
      </div>
      <div class="side right">
        <div>ROCKWALL FITNESS<span class="star">★</span></div>
        <div>FROM: BLR<span class="star">★</span></div>
        <div>TO: YOUR LIMITS<span class="star">★</span></div>
      </div>
    </div>
    <div class="corner-tl">CTN № 0047 / FY26</div>
    <div class="corner-br">EXPRESS · BLR</div>
    <div class="cutline"></div>
  </div>
</body>
</html>
