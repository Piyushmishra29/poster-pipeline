<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sticker — Wall · TAP IN LIFT ON (Rule 03 · fingerprint · OG members)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,75..150,400..900&display=swap" rel="stylesheet">
<style>
  /* A4 landscape · 297 x 210 + 3mm bleed = 303 x 216 mm */
  @page { size: 303mm 216mm; margin: 0; bleed: 3mm; marks: crop cross; background: #050505; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink:#050505;
    --lime:#CFFF3C;
    --paper:#F6F6F2;
  }
  html, body {
    width: 303mm; height: 216mm;
    background: var(--ink); color: var(--paper);
    font-family: 'Anybody', sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .stage {
    position: relative; width: 303mm; height: 216mm;
    overflow: hidden; background: var(--ink);
  }
  .cutline {
    position: absolute; top: 4mm; left: 4mm;
    width: 295mm; height: 208mm;
    border: 0.6mm dashed #FF00FF;
    z-index: 999;
  }

  /* ───────────────────────────────────────────
     ACT 1 — HERO (read from 10m+)
     ─────────────────────────────────────────── */
  .hero {
    position: absolute;
    top: 16mm; left: 10mm; right: 10mm;
    z-index: 4;
    text-align: center;
  }
  .hero h1 {
    font-family: 'Anybody', sans-serif;
    font-weight: 900;
    font-variation-settings: "wdth" 75;
    font-size: 144pt;
    line-height: 0.82;
    letter-spacing: -0.04em;
    color: var(--paper);
    text-transform: uppercase;
  }
  .hero h1 .line {
    display: block;
    white-space: nowrap;
  }
  .hero h1 .lime { color: var(--lime); }

  /* ───────────────────────────────────────────
     FINGERPRINT MARK (fills the middle band, biometric cue)
     ─────────────────────────────────────────── */
  .print {
    position: absolute;
    top: 104mm; left: 0; right: 0;
    z-index: 3;
    text-align: center;
  }
  .print svg {
    width: 48mm; height: auto;
    display: inline-block;
  }

  /* ───────────────────────────────────────────
     ACT 2 — SUB (read from 5m)
     ─────────────────────────────────────────── */
  .priceline {
    position: absolute;
    bottom: 40mm; left: 18mm; right: 18mm;
    z-index: 4;
    text-align: center;
    font-family: 'Anybody', sans-serif;
    font-weight: 900;
    font-variation-settings: "wdth" 110;
    font-size: 56pt;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--paper);
    text-transform: uppercase;
  }
  .priceline .lime {
    color: var(--lime);
  }

  /* ───────────────────────────────────────────
     ACT 3 — TERTIARY NOTE (read from 3m)
     ─────────────────────────────────────────── */
  .note {
    position: absolute;
    bottom: 16mm; left: 18mm; right: 18mm;
    z-index: 4;
    text-align: center;
    font-family: 'Anybody', sans-serif;
    font-weight: 900;
    font-variation-settings: "wdth" 110;
    font-size: 28pt;
    line-height: 1;
    letter-spacing: -0.005em;
    color: var(--lime);
    text-transform: uppercase;
  }
  .note b {
    color: var(--paper);
    font-weight: 900;
  }
  .note .dot {
    color: var(--paper);
    padding: 0 2.5mm;
  }
</style>
</head>
<body>
  <div class="stage">

    <!-- ACT 1 — the action (tap = fingerprint) -->
    <div class="hero">
      <h1>
        <span class="line">TAP IN.</span>
        <span class="line lime">LIFT ON.</span>
      </h1>
    </div>

    <!-- fingerprint mark -->
    <div class="print">
      <svg viewBox="0 0 120 108" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#CFFF3C" stroke-width="3.1" stroke-linecap="round">
          <path d="M59.0 57.3 A3 3.5 0 1 1 61.0 57.3"/>
          <path d="M57.3 62.5 A8 9 0 1 1 62.7 62.5"/>
          <path d="M54.9 70.0 A15 17 0 1 1 65.1 70.0"/>
          <path d="M52.5 77.5 A22 25 0 1 1 67.5 77.5"/>
          <path d="M50.1 85.0 A29 33 0 1 1 69.9 85.0"/>
          <path d="M47.7 92.5 A36 41 0 1 1 72.3 92.5"/>
          <path d="M45.3 100.1 A43 49 0 1 1 74.7 100.1"/>
        </g>
      </svg>
    </div>

    <!-- ACT 2 — the why (warm: the system skipped you) -->
    <div class="priceline">
      <span class="lime">THE SCANNER</span> MISSED YOU.
    </div>

    <!-- ACT 3 — the help (OG members explicitly welcomed) -->
    <div class="note">
      <b>RECEPTION</b><span class="dot">&middot;</span>30 SECONDS<span class="dot">&middot;</span><b>OG MEMBERS TOO</b>
    </div>

    <div class="cutline"></div>
  </div>
</body>
</html>
