<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sticker — Front Desk · LIFT &gt; HAGGLE.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,75..150,400..900;1,75..150,400..900&family=Inter+Tight:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* A4 portrait counter sticker · 210 x 297 + 3mm bleed = 216 x 303 mm */
  @page { size: 216mm 303mm; margin: 0; bleed: 3mm; marks: crop cross; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{ --lime:#D1DD27; --ink:#171921; --paper:#FFFFFF;
         --grey1:#898989; --grey2:#B3B3B3; --mute:rgba(255,255,255,0.6); }
  html, body { width: 216mm; height: 303mm; background: var(--ink); color: var(--paper);
    font-family: 'Inter Tight', sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .stage { position: relative; width: 216mm; height: 303mm; }

  /* white die-cut base */
  .diecut { position: absolute; top: 2mm; left: 2mm; width: 212mm; height: 299mm; background: var(--paper); }
  /* navy art body — hugs cut with ~1mm halo */
  .body {
    position: absolute; top: 5mm; left: 5mm;
    width: 206mm; height: 293mm;
    background: var(--ink);
    overflow: hidden;
  }
  /* magenta die-line */
  .cutline {
    position: absolute; top: 4mm; left: 4mm;
    width: 208mm; height: 295mm;
    background: transparent; border: 0.6mm dashed #FF00FF;
    z-index: 9;
  }

  /* top hairline + tiny brand whisper */
  .top-rule { position: absolute; top: 18mm; left: 18mm; right: 18mm; height: 0.4mm; background: var(--lime); }
  .top-label {
    position: absolute; top: 22mm; left: 18mm; right: 18mm;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 8pt; letter-spacing: 0.34em; color: var(--lime);
    text-transform: uppercase;
  }
  .top-label b { color: var(--paper); }

  /* hero block — ONE LINE */
  .hero {
    position: absolute; top: 122mm; left: 0; right: 0; text-align: center;
    font-family: 'Anybody', sans-serif; font-weight: 900;
    font-variation-settings: "wdth" 130;
    font-size: 92pt; line-height: 0.9; letter-spacing: -0.04em;
    color: var(--paper); text-transform: uppercase;
    white-space: nowrap;
    z-index: 3;
  }
  .hero .lime { color: var(--lime); }
  .hero .gt {
    color: var(--lime);
    font-variation-settings: "wdth" 110;
    margin: 0 2mm;
  }

  /* big tonal section numeral — bleeding off bottom-right (signature brand-kit divider device) */
  .ghost-num {
    position: absolute; right: -22mm; bottom: -38mm;
    font-family: 'Anybody', sans-serif; font-weight: 900;
    font-variation-settings: "wdth" 150;
    font-size: 360pt; line-height: 0.7; letter-spacing: -0.06em;
    color: rgba(255,255,255,0.045);
    z-index: 1; pointer-events: none;
  }

  /* small lime knurl-ring decoration — top right */
  .knurl {
    position: absolute; top: 56mm; right: 32mm;
    width: 30mm; height: 30mm; opacity: 0.85;
    z-index: 2;
  }
  /* small barbell silhouette — left of hero, mirror-balance */
  .bell {
    position: absolute; top: 92mm; left: 28mm;
    width: 36mm; height: 14mm; opacity: 0.85;
    z-index: 2;
  }
  /* diamond accent chips — flank the hero */
  .diamond {
    position: absolute; top: 150mm;
    width: 5mm; height: 5mm; background: var(--lime);
    transform: rotate(45deg); z-index: 2;
  }
  .diamond.l { left: 28mm; }
  .diamond.r { right: 28mm; }

  /* sub line — the warm pat */
  .sub {
    position: absolute; top: 188mm; left: 0; right: 0; text-align: center;
    font-family: 'Inter Tight', sans-serif; font-weight: 800;
    font-size: 16pt; line-height: 1.25; letter-spacing: 0.005em;
    color: var(--paper); text-transform: uppercase;
    max-width: 180mm; margin: 0 auto;
  }
  .sub .lime { color: var(--lime); }

  /* mid hairline above the credit line */
  .mid-rule { position: absolute; top: 224mm; left: 50%; width: 20mm; height: 0.4mm; background: var(--lime); margin-left: -10mm; }
  .credit {
    position: absolute; top: 232mm; left: 0; right: 0; text-align: center;
    font-family: 'Inter Tight', sans-serif; font-weight: 500;
    font-style: italic;
    font-size: 11pt; line-height: 1.4; letter-spacing: 0.01em;
    color: var(--mute);
    max-width: 160mm; margin: 0 auto;
  }
  .credit b { color: var(--lime); font-style: normal; font-weight: 800; }

  /* bottom hairline + footer */
  .bot-rule { position: absolute; bottom: 22mm; left: 18mm; right: 18mm; height: 0.4mm; background: var(--lime); }
  .footer {
    position: absolute; bottom: 12mm; left: 18mm; right: 18mm;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 7.5pt; letter-spacing: 0.34em; color: var(--lime);
    text-transform: uppercase;
  }
  .footer b { color: var(--paper); }

</style>
</head>
<body>
  <div class="stage">
    <div class="diecut"></div>
    <div class="body">

      <div class="top-rule"></div>
      <div class="top-label"><span><b>ROCKWALL FITNESS</b></span><span>BLR · FY26</span></div>

      <!-- background section numeral -->
      <div class="ghost-num">01</div>

      <!-- decorative knurl ring (gym signature) -->
      <svg class="knurl" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="30" r="26" fill="none" stroke="#D1DD27" stroke-width="2.4" stroke-dasharray="1.6 2.6"/>
        <circle cx="30" cy="30" r="18" fill="none" stroke="#D1DD27" stroke-width="0.4" opacity="0.5"/>
      </svg>

      <!-- decorative barbell -->
      <svg class="bell" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
        <g fill="#D1DD27" stroke="none">
          <rect x="0" y="6" width="14" height="28" rx="2"/>
          <rect x="14" y="12" width="6" height="16" rx="1"/>
          <rect x="20" y="16" width="60" height="8"/>
          <rect x="80" y="12" width="6" height="16" rx="1"/>
          <rect x="86" y="6" width="14" height="28" rx="2"/>
        </g>
      </svg>

      <!-- flanking diamond ticks -->
      <div class="diamond l"></div>
      <div class="diamond r"></div>

      <div class="hero">
        LIFT<span class="gt">&gt;</span>HAGGLE<span class="lime">.</span>
      </div>

      <div class="sub">
        Same price <span class="lime">for everyone.</span><br>
        Even the owner.
      </div>

      <div class="mid-rule"></div>
      <div class="credit">
        Save the negotiation for the <b>last rep.</b>
      </div>

      <div class="bot-rule"></div>
      <div class="footer">
        <span>HOUSE RULE / <b>FY 2026</b></span>
        <span>SAME RATE SINCE 2018</span>
      </div>
    </div>
    <div class="cutline"></div>
  </div>
</body>
</html>
