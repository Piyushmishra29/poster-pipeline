<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sticker — Front Desk · FIXED.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,75..150,400..900;1,75..150,400..900&family=Inter+Tight:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* A4 portrait front-desk sticker · 210 x 297 + 3mm bleed = 216 x 303 mm */
  @page { size: 216mm 303mm; margin: 0; bleed: 3mm; marks: crop cross; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{ --lime:#D1DD27; --ink:#171921; --paper:#FFFFFF; }
  html, body { width: 216mm; height: 303mm; background: var(--lime); color: var(--ink);
    font-family: 'Inter Tight', sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .stage { position: relative; width: 216mm; height: 303mm; }

  /* white die-cut + magenta die-line */
  .diecut { position: absolute; top: 2mm; left: 2mm; width: 212mm; height: 299mm; background: var(--paper); }
  /* lime full-bleed sign body — hugs the cut with a ~1mm halo */
  .body {
    position: absolute; top: 5mm; left: 5mm;
    width: 206mm; height: 293mm;
    background: var(--lime);
    overflow: hidden;
  }
  .cutline {
    position: absolute; top: 4mm; left: 4mm;
    width: 208mm; height: 295mm;
    background: transparent; border: 0.6mm dashed #FF00FF;
    z-index: 9;
  }

  /* corner register ticks — the only structural accent */
  .tick {
    position: absolute; width: 12mm; height: 12mm; z-index: 4;
  }
  .tick::before, .tick::after {
    content: ''; position: absolute; background: var(--ink);
  }
  .tick::before { /* horizontal arm */ top: 0; left: 0; width: 100%; height: 0.8mm; }
  .tick::after  { /* vertical arm */ top: 0; left: 0; width: 0.8mm; height: 100%; }
  .tick-tl { top: 15mm; left: 15mm; }
  .tick-tr { top: 15mm; right: 15mm; transform: scaleX(-1); }

  /* top kicker — minimal, just a brand whisper */
  .kicker {
    position: absolute; top: 18mm; left: 0; right: 0; text-align: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 9pt; letter-spacing: 0.5em; color: var(--ink);
    text-transform: uppercase;
  }

  /* hero — the whole point */
  .hero {
    position: absolute; top: 80mm; left: 0; right: 0; text-align: center;
    font-family: 'Anybody', sans-serif; font-weight: 900;
    font-variation-settings: "wdth" 140;
    font-size: 196pt; line-height: 0.82; letter-spacing: -0.04em;
    color: var(--ink); text-transform: uppercase;
  }

  /* register hairline above the tagline */
  .rule {
    position: absolute; left: 50%; top: 192mm;
    width: 24mm; height: 0.4mm; background: var(--ink);
    margin-left: -12mm;
  }

  /* tagline — the smile */
  .tagline {
    position: absolute; top: 198mm; left: 0; right: 0; text-align: center;
    font-family: 'Inter Tight', sans-serif; font-weight: 800;
    font-size: 17pt; line-height: 1.15; letter-spacing: 0.005em;
    color: var(--ink); text-transform: uppercase;
  }

  /* sub line — the warm pat */
  .sub {
    position: absolute; bottom: 42mm; left: 0; right: 0; text-align: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 10pt; letter-spacing: 0.36em; color: var(--ink);
    text-transform: uppercase;
  }

  /* footer */
  .footer {
    position: absolute; bottom: 22mm; left: 0; right: 0; text-align: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 800;
    font-size: 8pt; letter-spacing: 0.34em; color: var(--ink);
    text-transform: uppercase; opacity: 0.7;
  }

  /* tiny corner ticks at the bottom too, mirroring top */
  .tick-bl { bottom: 15mm; left: 15mm; transform: scaleY(-1); }
  .tick-br { bottom: 15mm; right: 15mm; transform: scale(-1, -1); }
</style>
</head>
<body>
  <div class="stage">
    <div class="diecut"></div>
    <div class="body">
      <div class="tick tick-tl"></div>
      <div class="tick tick-tr"></div>

      <div class="kicker">ROCKWALL FITNESS · HOUSE RULE</div>

      <div class="hero">FIXED.</div>

      <div class="rule"></div>
      <div class="tagline">The bar moves. The price doesn't.</div>

      <div class="sub">One price · Every member · Always</div>
      <div class="footer">ROCKWALL FITNESS · BANGALORE · FY26</div>

      <div class="tick tick-bl"></div>
      <div class="tick tick-br"></div>
    </div>
    <div class="cutline"></div>
  </div>
</body>
</html>
