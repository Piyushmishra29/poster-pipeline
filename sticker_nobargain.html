<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sticker — Front Desk · respectfully, no.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,75..150,400..900;1,75..150,400..900&family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* A4 portrait counter sticker · 210 x 297 + 3mm bleed = 216 x 303 mm */
  @page { size: 216mm 303mm; margin: 0; bleed: 3mm; marks: crop cross; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{ --lime:#D1DD27; --ink:#171921; --paper:#FFFFFF;
         --grey1:#898989; --grey2:#B3B3B3; --mute:rgba(255,255,255,0.55); }
  html, body { width: 216mm; height: 303mm; background: var(--ink); color: var(--paper);
    font-family: 'Inter Tight', sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .stage { position: relative; width: 216mm; height: 303mm; }

  /* die-cut + die-line (unchanged pattern) */
  .diecut { position: absolute; top: 2mm; left: 2mm; width: 212mm; height: 299mm; background: var(--paper); }
  .body {
    position: absolute; top: 5mm; left: 5mm;
    width: 206mm; height: 293mm;
    background: var(--ink);
    overflow: hidden;
  }
  .cutline {
    position: absolute; top: 4mm; left: 4mm;
    width: 208mm; height: 295mm;
    background: transparent; border: 0.6mm dashed #FF00FF;
    z-index: 9;
  }

  /* top-left kicker — lowercase mono, very small */
  .kicker {
    position: absolute; top: 22mm; left: 22mm;
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    font-size: 9pt; letter-spacing: 0.12em; color: var(--lime);
    text-transform: none;
  }
  .kicker b { color: var(--paper); font-weight: 700; }

  /* top-right meta — lowercase mono */
  .meta {
    position: absolute; top: 22mm; right: 22mm; text-align: right;
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    font-size: 8pt; letter-spacing: 0.16em; color: var(--mute);
    text-transform: lowercase;
  }
  .meta b { color: var(--lime); font-weight: 700; }

  /* HERO — lowercase, left-aligned, asymmetric */
  .hero {
    position: absolute; top: 88mm; left: 22mm; right: 22mm;
    font-family: 'Inter Tight', sans-serif;
    color: var(--paper);
    z-index: 3;
  }
  .hero .l1 {
    display: block;
    font-family: 'Inter Tight', sans-serif; font-weight: 500;
    font-size: 54pt; line-height: 0.98; letter-spacing: -0.03em;
    color: var(--paper);
    font-style: italic;
    margin-bottom: 6mm;
  }
  .hero .l2 {
    display: block;
    font-family: 'Inter Tight', sans-serif; font-weight: 900;
    font-size: 160pt; line-height: 0.88; letter-spacing: -0.06em;
    color: var(--lime);
  }
  .hero .l2 .dot {
    display: inline-block;
    color: var(--ink); background: var(--lime);
    padding: 0 2mm 3mm;
    margin-left: 1mm;
    line-height: 0.88;
  }
  /* sparkle next to the "no" */
  .spark-hero {
    position: absolute; top: 168mm; left: 154mm;
    width: 22mm; height: 22mm;
    z-index: 4;
  }

  /* sub band — left aligned, casual */
  .sub {
    position: absolute; top: 220mm; left: 22mm; right: 60mm;
    font-family: 'Inter Tight', sans-serif; font-weight: 600;
    font-size: 16pt; line-height: 1.4; letter-spacing: -0.005em;
    color: var(--paper);
    z-index: 3;
  }
  .sub .lime { color: var(--lime); font-weight: 800; }
  .sub b { font-weight: 800; color: var(--paper); }
  .sub i { font-style: italic; font-weight: 500; color: var(--grey2); }

  /* scattered sparkles (gen-z internet sticker energy) */
  .spark {
    position: absolute; z-index: 2; opacity: 0.95;
  }
  .spark-a { top: 56mm; right: 40mm; width: 14mm; height: 14mm; transform: rotate(-12deg); }
  .spark-b { top: 198mm; right: 24mm; width: 18mm; height: 18mm; transform: rotate(18deg); }
  .spark-c { top: 256mm; left: 38mm; width: 10mm; height: 10mm; transform: rotate(-8deg); opacity: 0.6; }

  /* bottom-left footer — lowercase mono */
  .footer {
    position: absolute; bottom: 18mm; left: 22mm;
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 8pt; letter-spacing: 0.16em; color: var(--lime);
    text-transform: lowercase;
  }
  .footer b { color: var(--paper); font-weight: 800; }

  /* bottom-right tag — tiny */
  .tag {
    position: absolute; bottom: 18mm; right: 22mm; text-align: right;
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    font-size: 7pt; letter-spacing: 0.18em; color: var(--mute);
    text-transform: lowercase;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="diecut"></div>
    <div class="body">

      <div class="kicker">// <b>house rule</b> · no. 01</div>
      <div class="meta">rockwall fitness<br><b>blr · fy26</b></div>

      <!-- decorative sparkles -->
      <svg class="spark spark-a" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path fill="#D1DD27" d="M50 0 C52 38 62 48 100 50 C62 52 52 62 50 100 C48 62 38 52 0 50 C38 48 48 38 50 0 Z"/>
      </svg>

      <div class="hero">
        <span class="l1">respectfully,</span>
        <span class="l2">no<span class="dot">.</span></span>
      </div>

      <svg class="spark spark-hero" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFFFFF" d="M50 0 C52 38 62 48 100 50 C62 52 52 62 50 100 C48 62 38 52 0 50 C38 48 48 38 50 0 Z"/>
      </svg>

      <svg class="spark spark-b" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path fill="#D1DD27" d="M50 0 C52 38 62 48 100 50 C62 52 52 62 50 100 C48 62 38 52 0 50 C38 48 48 38 50 0 Z"/>
      </svg>

      <div class="sub">
        the price is the price. <span class="lime">same for everyone</span> who walks in — yes, <b>even the owner</b>.<br>
        <i>save the negotiation for the last rep.</i>
      </div>

      <svg class="spark spark-c" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path fill="#D1DD27" d="M50 0 C52 38 62 48 100 50 C62 52 52 62 50 100 C48 62 38 52 0 50 C38 48 48 38 50 0 Z"/>
      </svg>

      <div class="footer">rockwall fitness · <b>since '18</b> · same rate, same vibe</div>
      <div class="tag">no haggle era ✦</div>
    </div>
    <div class="cutline"></div>
  </div>
</body>
</html>
